<svg width="800" height="800" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand-text-perfect {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 52px;
      letter-spacing: -1.2px;
    }
  </style>

  <defs>
    <linearGradient id="sentinel-perfect-gradient-full" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="50%" stop-color="#5C6BC0" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>
  </defs>

  <!-- Dark Background matching reference card -->
  <rect width="400" height="400" rx="40" fill="#0F1219" />

  <!-- Logo Mark Group -->
  <g transform="translate(68, 25) scale(2.64)">
    <g stroke="url(#sentinel-perfect-gradient-full)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Main Outer Shield -->
      <path d="M 50,10 L 20,24 V 46 C 20,68 35,80 50,84 C 65,80 80,68 80,46 V 24 Z" />

      <!-- Central Vertical Axis Line -->
      <line x1="50" y1="10" x2="50" y2="84" />

      <!-- Upper 3D Facet Roof Lines -->
      <path d="M 20,24 L 50,32 L 80,24" />

      <!-- Outer Eye Diamond -->
      <path d="M 20,46 L 50,32 L 80,46 L 50,60 Z" />

      <!-- Inner Hexagon -->
      <path d="M 32,46 L 40,38 H 60 L 68,46 L 60,54 H 40 Z" />

      <!-- Pupil -->
      <circle cx="50" cy="46" r="6.8" fill="url(#sentinel-perfect-gradient-full)" stroke="none" />

      <!-- Pupil Glint -->
      <circle cx="48.2" cy="44.2" r="1.8" fill="#FFFFFF" stroke="none" />
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="332" text-anchor="middle" class="brand-text-perfect" fill="url(#sentinel-perfect-gradient-full)">
    SentinelAI
  </text>
</svg>
