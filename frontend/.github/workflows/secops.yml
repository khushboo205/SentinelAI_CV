name: SentinelAI DevSecOps Security Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  sast_scan:
    name: Static Application Security Testing (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Run Bandit SAST Security Scanner
        run: |
          pip install bandit
          bandit -r src/ database/ -ll -ii

      - name: Run Semgrep Security Rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

  secret_scanning:
    name: Secret & Credential Exposure Scan (Trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main

  container_scan:
    name: Container Vulnerability Scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          security-checks: "vuln,config,secret"
          severity: "CRITICAL,HIGH"
